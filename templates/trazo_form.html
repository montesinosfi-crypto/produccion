{% extends "base.html" %}
{% block title %}Confirmar Trazo{% endblock %}
{% block content %}
<div class="card">
    <h1>Confirmar Trazo</h1>
    <p style="margin-bottom:1.2rem;">Programa: <strong>{{ programa.numero_programa }}</strong></p>
    <form method="POST">
        <div>
            <label>Observaciones</label>
            <textarea name="observaciones" rows="3" placeholder="Notas del trazo..."></textarea>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-success">Confirmar que el Trazo está Listo</button>
            <a href="{{ url_for('ver_programa', prog_id=programa.id) }}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
