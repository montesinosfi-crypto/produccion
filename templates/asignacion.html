{% extends "base.html" %}
{% block title %}Asignación - {{ orden.numero_orden }}{% endblock %}

{% block content %}
<div class="card">
    <h1>Asignación de Corte (Gerente)</h1>
    <p style="margin-bottom:1.5rem;">
        Orden: <strong>{{ orden.numero_orden }}</strong> &nbsp;|&nbsp;
        <span class="badge badge-{{ orden.estado_actual|lower|replace(' ', '_') }}">{{ orden.estado_actual }}</span>
    </p>

    <form method="POST">
        <div class="form-row">
            <div>
                <label>Fecha de salida a Maquila</label>
                <input type="date" name="fecha_salida_maquila"
                       value="{{ asignacion.fecha_salida_maquila if asignacion else '' }}">
            </div>
            <div>
                <label>Nombre del Maquilero *</label>
                <input type="text" name="nombre_maquilero" required
                       value="{{ asignacion.nombre_maquilero if asignacion else '' }}"
                       placeholder="Nombre del maquilero">
            </div>
        </div>

        <div>
            <label>Observaciones</label>
            <textarea name="observaciones" rows="2">{{ asignacion.observaciones if asignacion else '' }}</textarea>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">
                {{ 'Actualizar Asignación' if asignacion else 'Guardar Asignación' }}
            </button>
            <a href="{{ url_for('ver_orden', orden_id=orden.id) }}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
