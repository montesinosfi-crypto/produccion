{% extends "base.html" %}
{% block title %}Nuevo Programa de Corte{% endblock %}
{% block content %}
<div class="card">
    <h1>Nuevo Programa de Corte</h1>
    <p style="color:#64748b;margin-bottom:1.3rem;">Ingresa el número de programa y los puntos a cortar (modelo, color y cantidades por talla).</p>
    <form method="POST" id="formPrograma">
        <div class="form-row">
            <div>
                <label>Número de Programa *</label>
                <input type="text" name="numero_programa" required placeholder="Ej: PROG-2026-001">
            </div>
        </div>
        <div>
            <label>Observaciones</label>
            <textarea name="observaciones" rows="2"></textarea>
        </div>

        <h3 style="margin-top:1.2rem;">Puntos del Programa</h3>
        <div id="puntos-container"></div>
        <button type="button" class="btn btn-outline btn-sm" onclick="agregarPunto()" style="margin:0.8rem 0 1.2rem;">+ Agregar punto</button>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Crear Programa</button>
            <a href="{{ url_for('lista_programas') }}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>
<script>
const TALLAS = ['XS','S','M','L','XL','XXL','3XL','4XL','5XL','6XL'];
let puntoIdx = 0;

function agregarPunto() {
    const cont = document.getElementById('puntos-container');
    const div = document.createElement('div');
    div.className = 'card';
    div.style = 'padding:1rem;margin-bottom:0.8rem;background:#f8fafc;';
    div.innerHTML = `
        <div class="form-row">
            <div><label>Punto</label><input type="text" name="punto[]" required placeholder="Ej: 1"></div>
            <div><label>Modelo</label><input type="text" name="modelo[]" required></div>
            <div><label>Color</label><input type="text" name="color[]" required></div>
        </div>
        <label>Cantidades por Talla</label>
        <div class="tallas-grid" id="tallas-${puntoIdx}"></div>
        <input type="hidden" name="tallas_json[]" id="json-${puntoIdx}" value="{}">
    `;
    cont.appendChild(div);
    const grid = document.getElementById('tallas-' + puntoIdx);
    TALLAS.forEach(t => {
        const d = document.createElement('div');
        d.innerHTML = `<label>${t}</label><input type="number" min="0" value="0" data-talla="${t}" data-idx="${puntoIdx}" onchange="actualizarJson(${puntoIdx})">`;
        grid.appendChild(d);
    });
    puntoIdx++;
}
function actualizarJson(idx) {
    const inputs = document.querySelectorAll(`input[data-idx="${idx}"]`);
    const obj = {};
    inputs.forEach(inp => { if (parseInt(inp.value) > 0) obj[inp.dataset.talla] = parseInt(inp.value); });
    document.getElementById('json-' + idx).value = JSON.stringify(obj);
}
agregarPunto();
</script>
{% endblock %}
