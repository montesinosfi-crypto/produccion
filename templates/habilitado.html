{% extends "base.html" %}
{% block title %}Habilitado - {{ orden.numero_orden }}{% endblock %}

{% block content %}
<div class="card">
    <h1>Registro de Habilitado</h1>
    <p style="margin-bottom:1.5rem;">
        Orden: <strong>{{ orden.numero_orden }}</strong> &nbsp;|&nbsp;
        <span class="badge badge-{{ orden.estado_actual|lower|replace(' ', '_') }}">{{ orden.estado_actual }}</span>
    </p>

    <form method="POST">
        <div class="form-row">
            <div>
                <label>Estado del Habilitado *</label>
                <select name="estado" required>
                    <option value="Completo" {% if habilitado and habilitado.estado == 'Completo' %}selected{% endif %}>Completo</option>
                    <option value="Parcial" {% if habilitado and habilitado.estado == 'Parcial' %}selected{% endif %}>Parcial</option>
                </select>
            </div>
        </div>

        <div>
            <label>Observaciones</label>
            <textarea name="observaciones" rows="2" placeholder="Ej: Faltan etiquetas / Todo completo...">{{ habilitado.observaciones if habilitado else '' }}</textarea>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">
                {{ 'Actualizar Habilitado' if habilitado else 'Guardar Habilitado' }}
            </button>
            <a href="{{ url_for('ver_orden', orden_id=orden.id) }}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
